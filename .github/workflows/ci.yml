name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  test:
    if: ${{ github.repository == 'egibs/reconcile' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            "macos-15-intel",
            "macos-latest",
            "ubuntu-24.04-arm",
            "ubuntu-latest",
            "windows-11-arm",
            "windows-latest",
          ]
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run Tests
        if: runner.os != 'Windows'
        run: |
          make test

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          make test-win

  bench:
    if: ${{ github.repository == 'egibs/reconcile' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            "macos-15-intel",
            "macos-latest",
            "ubuntu-24.04-arm",
            "ubuntu-latest",
            "windows-11-arm",
            "windows-latest",
          ]
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run Benchmarks
        run: |
          make bench

  lint:
    if: ${{ github.repository == 'egibs/reconcile' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ["golangci-lint-lint", "gosec", "modernize", "osv", "vet"]
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            github.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run make ${{ matrix.target }}
        run: |
          make ${{ matrix.target }}

  # The fuzzer list is derived from the test binary, so the fuzz matrix can
  # never drift from the fuzz targets defined in the source.
  fuzz-list:
    if: ${{ github.repository == 'egibs/reconcile' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fuzzers: ${{ steps.list.outputs.fuzzers }}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: List fuzz targets
        id: list
        run: |
          echo "fuzzers=$(go test -list '^Fuzz' -run '^$' ./pkg/files | grep '^Fuzz' | jq -cnR '[inputs]')" >> "$GITHUB_OUTPUT"

  fuzz:
    if: ${{ github.repository == 'egibs/reconcile' }}
    needs: fuzz-list
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            "macos-15-intel",
            "macos-latest",
            "ubuntu-24.04-arm",
            "ubuntu-latest",
            "windows-11-arm",
            "windows-latest",
          ]
        test: ${{ fromJSON(needs.fuzz-list.outputs.fuzzers) }}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run ${{ matrix.test }}
        run: |
          go test -parallel=1 -fuzz='^${{ matrix.test }}$' -run='^${{ matrix.test }}$' -fuzztime=10s ./pkg/files

      # Fuzz-found failures write a minimized reproducer to testdata/fuzz on
      # the ephemeral runner; upload it so the failing input survives the job.
      - name: Upload fuzz failure reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducer-${{ matrix.test }}-${{ matrix.os }}
          path: pkg/files/testdata/fuzz/
          if-no-files-found: ignore
